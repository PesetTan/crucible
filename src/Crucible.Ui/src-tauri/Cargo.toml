[package]
name = "crucible-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
[target.'cfg(windows)'.dependencies]
dunce = "1"
tauri-plugin-dialog = "2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
