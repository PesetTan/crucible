<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Matchlab · Mana logos</title><style>/* Coordinated mana marks: shape carries meaning independently of color. */
.mana-symbols{display:inline-flex;align-items:center;gap:7px;flex-wrap:wrap}
.mana-logo{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;flex:none;border-radius:50%;background:var(--mana-tint,#d1d8dd);color:#172026;border:1px solid #ffffff50;vertical-align:middle}
.mana-logo::before{content:"";display:block;width:80%;height:80%;background:currentColor;mask:var(--mana-image) center/contain no-repeat;-webkit-mask:var(--mana-image) center/contain no-repeat}
.mana-monochrome .mana-logo{background:transparent;color:inherit;border-color:currentColor}
@media(forced-colors:active){.mana-logo{background:Canvas;color:CanvasText;border-color:CanvasText;forced-color-adjust:none}}
.mana-white{--mana-tint:#f4e7b8;--mana-image:url("white.svg?v=10")}
.mana-blue{--mana-tint:#8cc9ee;--mana-image:url("blue.svg?v=5")}
.mana-black{--mana-tint:#c4b5d5;--mana-image:url("black.svg?v=6")}
.mana-red{--mana-tint:#f6a08e;--mana-image:url("red.svg?v=5")}
.mana-green{--mana-tint:#96d2a5;--mana-image:url("green.svg?v=5")}
.mana-colorless{--mana-tint:#d1d8dd;--mana-image:url("colorless.svg?v=5")}

gcaption>Black</figcaption></figure><figure><span class="mana-logo mana-red"></span><figcaption>Red</figcaption></figure><figure><span class="mana-logo mana-green"></span><figcaption>Green</figcaption></figure><figure><span class="mana-logo mana-colorless"></span><figcaption>Colorless</figcaption></figure></div><div class="small"><span class="mana-logo mana-white"></span><span class="mana-logo mana-blue"></span><span class="mana-logo mana-black"></span><span class="mana-logo mana-red"></span><span class="mana-logo mana-green"></span><span class="mana-logo mana-colorless"></span></div></section><section class="light mana-monochrome"><h2>Black on white</h2><div class="logos"><figure><span class="mana-logo mana-white"></span><figcaption>White</figcaption></figure><figure><span class="mana-logo mana-blue"></span><figcaption>Blue</figcaption></figure><figure><span class="mana-logo mana-black"></span><figcaption>Black</figcaption></figure><figure><span class="mana-logo mana-red"></span><figcaption>Red</figcaption></figure><figure><span class="mana-logo mana-green"></span><figcaption>Green</figcaption></figure><figure><span class="mana-logo mana-colorless"></span><figcaption>Colorless</figcaption></figure></div><div class="small"><span class="mana-logo mana-white"></span><span class="mana-logo mana-blue"></span><span class="mana-logo mana-black"></span><span class="mana-logo mana-red"></span><span class="mana-logo mana-green"></span><span class="mana-logo mana-colorless"></span></div></section><section class="dark mana-monochrome"><h2>White on black</h2><div class="logos"><figure><span class="mana-logo mana-white"></span><figcaption>White</figcaption></figure><figure><span class="mana-logo mana-blue"></span><figcaption>Blue</figcaption></figure><figure><span class="mana-logo mana-black"></span><figcaption>Black</figcaption></figure><figure><span class="mana-logo mana-red"></span><figcaption>Red</figcaption></figure><figure><span class="mana-logo mana-green"></span><figcaption>Green</figcaption></figure><figure><span class="mana-logo mana-colorless"></span><figcaption>Colorless</figcaption></figure></div><div class="small"><span class="mana-logo mana-white"></span><span class="mana-logo mana-blue"></span><span class="mana-logo mana-black"></span><span class="mana-logo mana-red"></span><span class="mana-logo mana-green"></span><span class="mana-logo mana-colorless"></span></div></section></html>
