name: Crucible Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crucible-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dotnet-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/export-public-source.py
      - run: python tests/check_public_source.py
      - run: python scripts/export-starter-catalog.py --verify
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python scripts/check-dotnet.py
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/Crucible.Ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Crucible.Ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
  forge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install checksum-verified engine in this disposable checkout
        run: dotnet run --project src/DeckTester -- --setup
      - run: python scripts/check-forge.py
  monitor:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: swift run --package-path macos/CrucibleMonitor MonitorChecks
