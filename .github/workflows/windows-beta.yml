name: Windows Desktop Beta
on:
  pull_request:
  push:
    branches: [main, master, 'codex/windows-*', 'codex/pyre-mvp1-ingestion']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: windows-beta-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Crucible.Ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/Crucible.Ui/src-tauri
          cache-on-failure: true
      - name: Check starter, frontend, backend, and worker lifecycle
        run: |
          python scripts/export-public-source.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/check_public_source.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/export-starter-catalog.py --verify
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($project in @('SchedulingChecks','HostSeparationChecks','PilotIdentityChecks','WorkshopChecks','DeckPackChecks','DeleteSessionChecks','WindowsBetaChecks','ForgeWorkerChecks')) {
            $extra = @()
            if ($project -eq 'WindowsBetaChecks') { $extra = @('--','resources/starter') }
            dotnet run --project "tests/$project/$project.csproj" @extra
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Build native hosts and per-user installer
        run: ./scripts/build-windows.ps1
      - name: Test native desktop ownership primitives
        working-directory: src/Crucible.Ui/src-tauri
        run: cargo test --release --target x86_64-pc-windows-msvc --locked
      - name: Check native UI gateway
        run: python tests/check_ui_host.py --runtime src/Crucible.Ui/src-tauri/resources/ui --output dist/windows/ui-host
      - name: Install Windows desktop WebDriver
        run: |
          ./scripts/install-windows-webdriver.ps1
      - name: Installed-app, real Forge, upgrade, and uninstall checks
        run: python tests/check_windows_desktop.py --installer (Get-ChildItem dist/windows/*-setup.exe).FullName --output dist/windows/evidence
      - name: Keep installer and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crucible-windows-x64-beta
          path: dist/windows/
          retention-days: 14
          if-no-files-found: warn
  mac-regression:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet run --project tests/WindowsBetaChecks -- resources/starter
      - run: dotnet run --project tests/ForgeWorkerChecks
      - run: dotnet run --project tests/PilotIdentityChecks
